[package]
name = "website-dispatch"
version = "0.6.0"
edition = "2021"

[lib]
name = "website_dispatch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "~2.10.1", features = ["protocol-asset", "tray-icon", "macos-private-api"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.4"
chrono = "0.4"
reqwest = { version = "0.11", features = ["json", "rustls-tls", "blocking", "multipart"], default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
urlencoding = "2.1"
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
regex = "1.10"
similar = "2.6"
mime_guess = "2.0"
dotenvy = "0.15"
axum = "0.7"
tower-http = { version = "0.6", features = ["cors"] }
local-ip-address = "0.6"
rand = "0.8"
tauri-plugin-window-state = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-fs = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-log = "2"
notify = "6"
notify-debouncer-mini = "0.4"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
log = "0.4"
rusqlite = { version = "0.31", features = ["bundled"] }
csv = "1.3"

# Native macOS NSWindow hooks (proxy icon, dirty-dot in close button).
# Only built on macOS — gated by target_os = "macos" inside src/mac_native.rs.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-app-kit = { version = "0.2", features = ["NSWindow", "NSResponder", "NSApplication", "NSMenu", "NSMenuItem"] }
objc2-foundation = { version = "0.2", features = ["NSString"] }
objc-sys = "0.3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
